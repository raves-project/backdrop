[package]
name = "backdrop"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
fraction = { version = "0.15.3", features = ["with-serde-support"] }
pisserror = "0.2"
serde = { version = "1.0.210", features = ["derive"] }
toml = "0.8.19"
async-watcher = "0.3.0"
tracing = "0.1.40"
async-walkdir = "2.0.0"
rand = "0.8.5"
# flutter_rust_bridge = "2.3.0"                                        # note: this is to specify acceptable inputs for flutter ffi

# kinda unused rn
jiff = { version = "0.1.13", features = ["serde"] }

# async
tokio = { version = "1.40", features = ["macros", "rt-multi-thread"] }
tokio-stream = "0.1.16"
futures = { version = "0.3.30", default-features = false, features = [
    "alloc",
    "std",
    "async-await",
    "executor",
] }

# related to image/video proc
kamadak_exif = { version = "0.5.5", package = "kamadak-exif" } # for photos. supports a many types.
nom-exif = { git = "https://github.com/onkoe/nom-exif", branch = "main", features = [
    "async",
] } # videos: mov, mp4
# FIXME: we need additional exif formats and the entirety of xmp
# image = { version = "0.25.2", features = ["avif-native"] }
image = "0.25.2"
infer = "0.16.0"
mp4parse = "0.17.0"
matroska = { version = "0.27.0", default-features = false }
camino = { version = "1.1.9", features = ["serde1"] }
sqlx = { version = "0.8.3", features = [
    "sqlite",
    "chrono",
    "json",
    "macros",
    "uuid",
    "runtime-tokio",
] }
chrono = { version = "0.4.39", features = ["serde"] }
uuid = { version = "1.12.0", features = ["v4", "serde"] }
avif-parse = "1.3.2"
blake3 = { version = "1.5.5", features = ["mmap", "rayon"] }

[dependencies.ffmpeg-next]
git = "https://github.com/onkoe/rust-ffmpeg"
branch = "master"
features = ["build"]

[dev-dependencies]
async-ctrlc = "1.2.0"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
dirs = "6.0.0"
anyhow = "1.0.95"

[profile.ci]
codegen-units = 256
debug = "none"
debug-assertions = false
incremental = true
inherits = "dev"
lto = "off"
opt-level = 0
overflow-checks = false
panic = "abort"
